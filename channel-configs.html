<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>채널 설정 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 p-4 text-slate-800">
    <section class="mx-auto max-w-7xl rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p class="text-sm font-medium text-indigo-600">채널 API 인증정보</p>
          <h1 class="text-2xl font-semibold text-slate-900">채널 설정</h1>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button id="init-btn" class="rounded-xl border border-indigo-300 px-4 py-2 text-sm font-semibold text-indigo-700 hover:bg-indigo-50">테이블 초기화</button>
          <button id="refresh-btn" class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">새로고침</button>
          <span id="status-text" class="text-sm text-slate-500">대기 중</span>
        </div>
      </div>

      <div class="grid gap-6 lg:grid-cols-[1.2fr_0.8fr]">
        <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white">
          <div class="border-b border-slate-200 bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-700">채널 목록</div>
          <div class="max-h-[560px] overflow-auto">
            <table class="w-full min-w-[860px] text-sm">
              <thead class="sticky top-0 bg-slate-900 text-xs text-white">
                <tr>
                  <th class="px-3 py-2 text-left">채널</th>
                  <th class="px-3 py-2 text-left">인증타입</th>
                  <th class="px-3 py-2 text-left">상점ID</th>
                  <th class="px-3 py-2 text-left">토큰/키 상태</th>
                  <th class="px-3 py-2 text-center">사용</th>
                  <th class="px-3 py-2 text-left">업데이트</th>
                </tr>
              </thead>
              <tbody id="config-table-body"></tbody>
            </table>
          </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
          <div class="mb-3 text-sm font-semibold text-slate-700">채널 정보 편집</div>

          <div class="space-y-3">
            <div>
              <label class="mb-1 block text-xs font-semibold text-slate-600" for="channel-code">채널 코드</label>
              <select id="channel-code" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"></select>
            </div>
            <div>
              <label class="mb-1 block text-xs font-semibold text-slate-600" for="display-name">표시명</label>
              <input id="display-name" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-semibold text-slate-600" for="auth-type">인증 타입</label>
              <select id="auth-type" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
                <option value="oauth2">oauth2</option>
                <option value="api_key">api_key</option>
                <option value="hmac">hmac</option>
                <option value="db">db</option>
                <option value="custom">custom</option>
              </select>
            </div>
            <div>
              <label class="mb-1 block text-xs font-semibold text-slate-600" for="base-url">Base URL</label>
              <input id="base-url" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="https://api.example.com" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-semibold text-slate-600" for="shop-id">shop_id / mall_id</label>
              <input id="shop-id" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            </div>

            <div class="grid gap-2">
              <label class="text-xs font-semibold text-slate-600" for="client-id">client_id (비우면 기존값 유지)</label>
              <input id="client-id" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
              <label class="text-xs font-semibold text-slate-600" for="client-secret">client_secret (비우면 기존값 유지)</label>
              <input id="client-secret" type="password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
              <label class="text-xs font-semibold text-slate-600" for="access-token">access_token (비우면 기존값 유지)</label>
              <input id="access-token" type="password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
              <label class="text-xs font-semibold text-slate-600" for="refresh-token">refresh_token (비우면 기존값 유지)</label>
              <input id="refresh-token" type="password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
              <label class="text-xs font-semibold text-slate-600" for="api-key">api_key (비우면 기존값 유지)</label>
              <input id="api-key" type="password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
              <label class="text-xs font-semibold text-slate-600" for="api-secret">api_secret (비우면 기존값 유지)</label>
              <input id="api-secret" type="password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            </div>

            <div>
              <label class="mb-1 block text-xs font-semibold text-slate-600" for="extra-json">extra_json</label>
              <textarea id="extra-json" rows="4" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder='{"key":"value"}'></textarea>
            </div>

            <label class="flex items-center gap-2 text-sm text-slate-700">
              <input id="is-enabled" type="checkbox" class="h-4 w-4 rounded border-slate-300" />
              채널 사용
            </label>

            <button id="save-btn" class="w-full rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">저장</button>
          </div>
        </div>
      </div>
    </section>

    <script>
      const previewBaseUrl = window.location.hostname && window.location.hostname !== 'file'
        ? `${window.location.protocol}//${window.location.host}`
        : 'http://127.0.0.1:5000';

      const defaults = [
        { channel_code: 'ownmall', display_name: '자사몰', auth_type: 'db' },
        { channel_code: 'coupang', display_name: '쿠팡', auth_type: 'hmac' },
        { channel_code: 'naver_smartstore', display_name: '네이버스마트스토어', auth_type: 'oauth2' },
        { channel_code: 'cafe24', display_name: 'cafe24', auth_type: 'oauth2' },
        { channel_code: 'firstmall', display_name: '퍼스트몰', auth_type: 'api_key' },
        { channel_code: 'auction', display_name: '옥션', auth_type: 'oauth2' },
        { channel_code: 'gmarket', display_name: 'g마켓', auth_type: 'oauth2' },
        { channel_code: '11st', display_name: '11번가', auth_type: 'api_key' }
      ];

      const tableBody = document.getElementById('config-table-body');
      const statusText = document.getElementById('status-text');
      const channelCode = document.getElementById('channel-code');
      const displayName = document.getElementById('display-name');
      const authType = document.getElementById('auth-type');
      const baseUrl = document.getElementById('base-url');
      const shopId = document.getElementById('shop-id');
      const clientId = document.getElementById('client-id');
      const clientSecret = document.getElementById('client-secret');
      const accessToken = document.getElementById('access-token');
      const refreshToken = document.getElementById('refresh-token');
      const apiKey = document.getElementById('api-key');
      const apiSecret = document.getElementById('api-secret');
      const extraJson = document.getElementById('extra-json');
      const isEnabled = document.getElementById('is-enabled');
      const initBtn = document.getElementById('init-btn');
      const refreshBtn = document.getElementById('refresh-btn');
      const saveBtn = document.getElementById('save-btn');

      let configRows = [];

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeText(value) {
        return String(value ?? '').trim();
      }

      function clearSecretInputs() {
        clientId.value = '';
        clientSecret.value = '';
        accessToken.value = '';
        refreshToken.value = '';
        apiKey.value = '';
        apiSecret.value = '';
      }

      function applyItemToForm(item) {
        const fallback = defaults.find((entry) => entry.channel_code === channelCode.value) || defaults[0];
        const source = item || fallback || {};

        displayName.value = source.display_name || source.channel_code || '';
        authType.value = source.auth_type || 'api_key';
        baseUrl.value = source.base_url || '';
        shopId.value = source.shop_id || '';
        extraJson.value = source.extra_json || '';
        isEnabled.checked = !!source.is_enabled;
        clearSecretInputs();
      }

      function tokenSummary(item) {
        const parts = [];
        if (item.client_id_masked || item.client_secret_masked) {
          parts.push('client');
        }
        if (item.access_token_masked || item.refresh_token_masked) {
          parts.push('token');
        }
        if (item.api_key_masked || item.api_secret_masked) {
          parts.push('apikey');
        }
        return parts.length ? parts.join(', ') : '-';
      }

      function renderTable() {
        if (!configRows.length) {
          tableBody.innerHTML = '<tr><td colspan="6" class="px-3 py-5 text-center text-slate-500">저장된 채널 설정이 없습니다.</td></tr>';
          return;
        }

        tableBody.innerHTML = configRows.map((item) => `
          <tr class="cursor-pointer border-b border-slate-100 hover:bg-slate-50" data-channel="${escapeHtml(item.channel_code || '')}">
            <td class="px-3 py-2 font-medium text-slate-800">${escapeHtml(item.display_name || item.channel_code || '-')}</td>
            <td class="px-3 py-2">${escapeHtml(item.auth_type || '-')}</td>
            <td class="px-3 py-2">${escapeHtml(item.shop_id || '-')}</td>
            <td class="px-3 py-2">${escapeHtml(tokenSummary(item))}</td>
            <td class="px-3 py-2 text-center">${item.is_enabled ? 'Y' : 'N'}</td>
            <td class="px-3 py-2">${escapeHtml(item.updated_at || '-')}</td>
          </tr>
        `).join('');

        tableBody.querySelectorAll('tr[data-channel]').forEach((row) => {
          row.addEventListener('click', () => {
            const code = row.getAttribute('data-channel') || '';
            channelCode.value = code;
            const found = configRows.find((item) => item.channel_code === code);
            applyItemToForm(found);
          });
        });
      }

      function renderChannelSelect() {
        channelCode.innerHTML = defaults.map((item) => `<option value="${escapeHtml(item.channel_code)}">${escapeHtml(item.display_name)} (${escapeHtml(item.channel_code)})</option>`).join('');
      }

      async function initTable() {
        statusText.textContent = '테이블 초기화 중...';
        initBtn.disabled = true;
        try {
          const response = await fetch(`${previewBaseUrl}/channel-configs/init`, { method: 'POST' });
          const data = await response.json();
          if (!response.ok || !data?.success) {
            throw new Error(data?.message || '초기화 실패');
          }
          statusText.textContent = data.message || '초기화 완료';
          await loadConfigs();
        } catch (error) {
          statusText.textContent = error.message || '초기화 실패';
          alert(statusText.textContent);
        } finally {
          initBtn.disabled = false;
        }
      }

      async function loadConfigs() {
        statusText.textContent = '목록 조회 중...';
        refreshBtn.disabled = true;
        try {
          const response = await fetch(`${previewBaseUrl}/channel-configs`);
          const data = await response.json();
          if (!response.ok || !data?.success) {
            throw new Error(data?.message || '목록 조회 실패');
          }
          configRows = Array.isArray(data.items) ? data.items : [];
          renderTable();
          const current = configRows.find((item) => item.channel_code === channelCode.value);
          applyItemToForm(current);
          statusText.textContent = `총 ${configRows.length}건`;
        } catch (error) {
          tableBody.innerHTML = `<tr><td colspan="6" class="px-3 py-5 text-center text-rose-600">${escapeHtml(error.message || '목록 조회 실패')}</td></tr>`;
          statusText.textContent = error.message || '조회 실패';
        } finally {
          refreshBtn.disabled = false;
        }
      }

      function buildPayload() {
        return {
          display_name: normalizeText(displayName.value),
          auth_type: normalizeText(authType.value),
          base_url: normalizeText(baseUrl.value),
          shop_id: normalizeText(shopId.value),
          client_id: normalizeText(clientId.value),
          client_secret: normalizeText(clientSecret.value),
          access_token: normalizeText(accessToken.value),
          refresh_token: normalizeText(refreshToken.value),
          api_key: normalizeText(apiKey.value),
          api_secret: normalizeText(apiSecret.value),
          extra_json: normalizeText(extraJson.value),
          is_enabled: isEnabled.checked
        };
      }

      async function saveConfig() {
        const code = normalizeText(channelCode.value);
        if (!code) {
          alert('채널 코드를 선택하세요.');
          return;
        }

        const payload = buildPayload();
        saveBtn.disabled = true;
        statusText.textContent = '저장 중...';
        try {
          const response = await fetch(`${previewBaseUrl}/channel-configs/${encodeURIComponent(code)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item: payload })
          });
          const data = await response.json();
          if (!response.ok || !data?.success) {
            throw new Error(data?.message || '저장 실패');
          }
          statusText.textContent = data.message || '저장 완료';
          clearSecretInputs();
          await loadConfigs();
        } catch (error) {
          statusText.textContent = error.message || '저장 실패';
          alert(statusText.textContent);
        } finally {
          saveBtn.disabled = false;
        }
      }

      channelCode.addEventListener('change', () => {
        const found = configRows.find((item) => item.channel_code === channelCode.value);
        applyItemToForm(found);
      });

      initBtn.addEventListener('click', initTable);
      refreshBtn.addEventListener('click', loadConfigs);
      saveBtn.addEventListener('click', saveConfig);

      renderChannelSelect();
      applyItemToForm(defaults[0]);
      loadConfigs();
    </script>
  </body>
</html>
